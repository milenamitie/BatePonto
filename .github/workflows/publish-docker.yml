name: Publish Docker images

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "backend/**"
      - "public/**"
      - "next.config.ts"
      - "package.json"
      - "package-lock.json"
      - "dockerfile"
      - ".github/workflows/publish-docker.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/bateponto-backend:latest
            ghcr.io/${{ github.repository_owner }}/bateponto-backend:${{ github.sha }}

      - name: Build and publish frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./dockerfile
          build-args: API_INTERNAL_URL=http://backend-bateponto:3000
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/bateponto-frontend:latest
            ghcr.io/${{ github.repository_owner }}/bateponto-frontend:${{ github.sha }}
